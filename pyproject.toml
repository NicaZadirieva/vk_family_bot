[project]
name = "vk-family-bot"
version = "0.1.0"
description = "Бот сообщества ВКонтакте для управления семейным расписанием, задачами, балльной мотивацией детей и общими заметками."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml (>=6.0.3,<7.0.0)",
    "ruff (>=0.16.0,<0.17.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "passlib[argon2,bcrypt] (>=1.7.4,<2.0.0)",
    "aiohttp (>=3.14.3,<4.0.0)",
    "redis (>=8.1.0,<9.0.0)",
]
