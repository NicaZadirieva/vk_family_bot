version: 1
disable_existing_loggers: false

formatters:
  default:
    format: "%(asctime)s - [%(levelname)s] - %(name)s - %(message)s - user_id: %(user_id)s"
    defaults:
      user_id: "-"
  simple:
    format: "%(asctime)s - %(levelname)s - %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    formatter: default
  vk_file:
    class: logging.handlers.TimedRotatingFileHandler
    encoding: utf-8
    filename: logs/prod/app_dev.log
    formatter: default
    when: "midnight"
    interval: 1
    backupCount: 7

loggers:
  app:
    level: INFO
    handlers: [console, vk_file]
    propagate: false
  __main__:
    level: INFO
    handlers: [console, vk_file]
    propagate: false

root:
  level: INFO
  handlers: [console]
